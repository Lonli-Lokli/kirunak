# kirunak's whole suite on macOS, Linux and Windows (asilak/kirunak-cross-platform AC-13): R19a asks that it passes on
# all three before a change merges. Windows runs with core.autocrlf true, so a checkout gets CRLF wherever
# .gitattributes does not hold it to LF. A run that reports no test fails: a glob that matches nothing is no pass.
name: test

on:
  push:
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Turn CRLF conversion on before the checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The dev dependency the promo recorder's tests load (@xterm/headless); kirunak itself needs none.
      - run: npm ci
      - name: A git identity for the tests' own repos
        run: |
          git config --global user.name "kirunak ci"
          git config --global user.email "ci@example.com"
      # Windows' runner sets TEMP to the profile's short (8.3) name, C:\Users\RUNNER~1\...; the tests' repos go under
      # the runner's own temp instead, a long name, as on a developer's machine. kirunak takes a short name where it
      # makes a path relative to a repo (lib/git.mjs toplevel); the worktree sweep does not yet. Windows only: Node
      # on Linux reads TMP and TEMP too, and the runner's temp is under its home, which kirunak prints as ~.
      - name: A temp folder with a long name on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: The suite
        shell: bash
        run: |
          code=0
          node --test --test-reporter=tap "test/*.test.mjs" > tap.txt || code=$?
          grep -E '^not ok' tap.txt || true
          grep -E '^# (tests|pass|fail|skipped|cancelled|todo)' tap.txt
          grep -qE '^# tests [1-9]' tap.txt || { echo "::error::the suite ran no test"; exit 1; }
          exit $code
      - name: Keep the TAP output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-${{ matrix.os }}
          path: tap.txt
